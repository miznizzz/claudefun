function FoodBadge({ status }) {
  const map = {
    walkin: { bg:"#E6F5EC", fg:C.walkin, label:"🟢 Walk-in" },
    booked: { bg:"#E6F5EC", fg:C.done, label:"✓ Booked" },
    optional:{ bg:"#FBF3E5", fg:"#B07B2E", label:"◐ Optional" },
    chosen:{ bg:"#FBF1D6", fg:"#B8860B", label:"⭐ Our pick" },
  };
  const s = map[status] || map.walkin;
  return (
    <span className="dm" style={{ display:"inline-flex", alignItems:"center", gap:4, background:s.bg, color:s.fg, border:`1px solid ${s.fg}40`, borderRadius:100, padding:"2px 9px", fontSize:10, fontWeight:500, letterSpacing:".05em", textTransform:"uppercase", whiteSpace:"nowrap", flexShrink:0 }}>{s.label}</span>
  );
}

function RouteMap({ highlight }) {
  return (
    <svg viewBox="0 0 100 100" style={{ width:"100%", maxWidth:260, display:"block", margin:"0 auto" }}>
      <path d="M30,10 Q55,8 70,20 Q82,32 78,50 Q74,65 60,75 Q50,82 45,90 Q40,95 38,92 Q36,88 40,82 Q44,76 42,70 Q38,62 30,58 Q20,52 18,42 Q16,30 22,20 Z" fill="#E0EEF4" stroke="#B8D4DE" strokeWidth=".5" />
      <text x="74" y="46" fontSize="3.5" fill="#8BAEBB" fontFamily="Georgia,serif" fontStyle="italic">Adriatic</text>
      <polyline points={`${BASES[0].dot.x},${BASES[0].dot.y} ${BASES[2].dot.x},${BASES[2].dot.y} ${BASES[1].dot.x},${BASES[1].dot.y} ${BASES[2].dot.x},${BASES[2].dot.y}`} fill="none" stroke={C.sand} strokeWidth=".9" strokeDasharray="2,1.5" opacity=".9" />
      {BASES.map((b,i) => {
        const active = highlight === b.name;
        return (
          <g key={i}>
            {active && <circle cx={b.dot.x} cy={b.dot.y} r="7" fill={b.color} opacity=".18" />}
            <circle cx={b.dot.x} cy={b.dot.y} r={active?4.5:3.2} fill={active?b.color:C.white} stroke={b.color} strokeWidth="1.5" style={{ transition:"all .3s" }} />
            <text x={b.dot.x+(i===1?-13:5)} y={b.dot.y+(i===0?-4:i===2?4:1)} fontSize="4.2" fill={active?b.color:C.muted} fontFamily="'Playfair Display',serif" fontWeight={active?"700":"400"} style={{ transition:"all .3s" }}>{b.name}</text>
          </g>
        );
      })}
      <text x={BASES[0].dot.x-2} y={BASES[0].dot.y-7} fontSize="5">✈️</text>
    </svg>
  );
}

          <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
            {FOOD_BY_PLACE.map((place,pi)=>(
              <div key={pi} className="card" style={{ background:C.white, borderRadius:16, overflow:"hidden", boxShadow:"0 2px 16px rgba(13,79,110,.06)", borderTop:`4px solid ${place.color}` }}>
                <div style={{ padding:"14px 18px 10px", display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ width:9, height:9, borderRadius:"50%", background:place.color, flexShrink:0 }} />
                  <p className="pf" style={{ fontSize:19, fontStyle:"italic", color:C.ink }}>{place.town}</p>
                </div>
                <div>
                  {place.items.map((it,ii)=>(
                    <div key={ii} style={{ padding:"12px 18px", borderTop:`1px solid ${C.border}`, display:"flex", gap:10, justifyContent:"space-between", alignItems:"flex-start" }}>
                      <div style={{ flex:1 }}>
                        <p className="dm" style={{ fontSize:13.5, fontWeight:500, color:C.ink }}>{it.name}</p>
                        <p className="dm" style={{ fontSize:11.5, color:C.muted, marginTop:2, lineHeight:1.45 }}>{it.note}</p>
                      </div>
                      <FoodBadge status={it.status} />
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div style={{ marginTop:24, background:C.white, borderRadius:12, padding:"16px 18px", border:`1px solid ${C.border}` }}>
            <p className="dm" style={{ fontSize:12, color:C.muted, lineHeight:1.6 }}>
              💬 For the optional ones, an Instagram DM gets the fastest reply. "Buonasera! Tavolo per 2, [day] verso le 20:00?" does the whole job. No pork throughout — Puglian menus lean seafood & lamb, just sidestep bombette, capocollo and salami antipasti.
            </p>
          </div>

          <p className="cg" style={{ textAlign:"center", color:C.muted, fontSize:15, fontStyle:"italic", marginTop:32, letterSpacing:".05em" }}>built with amore 🤍</p>
        </div>
      )}

      {/* PREP */}
      {tab==="prep" && (
        <div style={{ maxWidth:680, margin:"0 auto", padding:"28px 16px" }}>
          <h2 className="pf" style={{ fontSize:28, fontStyle:"italic", color:C.ink, marginBottom:6 }}>Before you fly</h2>
          <p className="cg" style={{ color:C.muted, fontSize:17, fontStyle:"italic", marginBottom:28 }}>The list, the bag, the whole pre-trip brain-dump — in one place.</p>

          {/* TO-DO */}
          <p className="dm" style={{ color:C.bari, fontSize:10, letterSpacing:".2em", textTransform:"uppercase", marginBottom:12, fontWeight:500 }}>✅ To-do · tap to tick</p>
          <div style={{ background:C.white, borderRadius:16, overflow:"hidden", boxShadow:"0 2px 16px rgba(13,79,110,.06)", marginBottom:32 }}>
            {TODO.map((t,i)=>(
              <div key={i} onClick={()=>setTodoDone(p=>({ ...p, [i]:!p[i] }))} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"14px 18px", cursor:"pointer", borderBottom: i<TODO.length-1?`1px solid ${C.border}`:"none", background: todoDone[i]?C.shore:(t.urgent&&!todoDone[i]?"#FDF1EE":C.white) }}>
                <div style={{ width:22, height:22, borderRadius:6, flexShrink:0, marginTop:1, border:`2px solid ${todoDone[i]?C.walkin:(t.urgent?C.book:C.border)}`, background: todoDone[i]?C.walkin:"transparent", display:"flex", alignItems:"center", justifyContent:"center", transition:"all .2s" }}>{todoDone[i] && <span style={{ color:C.white, fontSize:13 }}>✓</span>}</div>
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <p className="dm" style={{ fontSize:14, fontWeight:500, color: todoDone[i]?C.muted:C.ink, textDecoration: todoDone[i]?"line-through":"none" }}>{t.label}</p>
                    {t.urgent && !todoDone[i] && <span className="dm" style={{ fontSize:9, color:C.book, letterSpacing:".1em", textTransform:"uppercase", background:"#FBE4DE", padding:"2px 7px", borderRadius:100 }}>Urgent</span>}
                  </div>
                  {t.note && <p className="dm" style={{ fontSize:11.5, color:C.muted, marginTop:2, lineHeight:1.4 }}>{t.note}</p>}
                </div>
              </div>
            ))}
          </div>

          {/* PACKING */}
          <p className="dm" style={{ color:C.ostuni, fontSize:10, letterSpacing:".2em", textTransform:"uppercase", marginBottom:12, fontWeight:500 }}>🧳 Packing · dresses-led, car-free-light</p>
          <div style={{ display:"flex", flexDirection:"column", gap:12, marginBottom:24 }}>
            {PACKING.map((p,i)=>(
              <div key={i} className="card" style={{ background:C.white, borderRadius:16, padding:"16px 18px", borderLeft:`4px solid ${C.ostuni}`, boxShadow:"0 2px 16px rgba(13,79,110,.06)" }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                  <span style={{ fontSize:20 }}>{p.emoji}</span>
                  <p className="dm" style={{ fontSize:13, fontWeight:500, color:C.ink, letterSpacing:".03em" }}>{p.cat}</p>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {p.items.map((it,j)=>(
                    <div key={j} style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
                      <span style={{ color:C.ostuni, fontSize:11, marginTop:3, flexShrink:0 }}>◦</span>
                      <p className="dm" style={{ fontSize:13, color:"#3D3A36", lineHeight:1.5 }}>{it}</p>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* SKINCARE */}
          <div className="card" style={{ background:C.white, borderRadius:16, padding:"16px 18px", borderLeft:`4px solid ${C.polignano}`, boxShadow:"0 2px 16px rgba(13,79,110,.06)", marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
              <span style={{ fontSize:20 }}>🧴</span>
              <p className="dm" style={{ fontSize:13, fontWeight:500, color:C.ink }}>Skincare kit</p>
            </div>
            <p className="dm" style={{ fontSize:11.5, color:C.muted, marginBottom:10, fontStyle:"italic" }}>{SKINCARE.note}</p>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {SKINCARE.items.map((it,j)=>(
                <div key={j} style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
                  <span style={{ color:C.polignano, fontSize:11, marginTop:3, flexShrink:0 }}>◦</span>
                  <p className="dm" style={{ fontSize:13, color:"#3D3A36", lineHeight:1.5 }}>{it}</p>
                </div>
              ))}
            </div>
            <div style={{ marginTop:12, padding:"10px 12px", background:C.shore, borderRadius:8, border:`1px dashed ${C.polignano}55` }}>
              <p className="dm" style={{ fontSize:12, color:C.ink, lineHeight:1.5 }}><strong>One decision:</strong> {SKINCARE.decision}</p>
            </div>
          </div>

          <p className="cg" style={{ textAlign:"center", color:C.muted, fontSize:15, fontStyle:"italic", marginTop:32, letterSpacing:".05em" }}>built with amore 🤍</p>
        </div>
      )}

      {/* NEXT TIME */}
      {tab==="next" && (
        <div style={{ maxWidth:680, margin:"0 auto", padding:"28px 16px" }}>
          <h2 className="pf" style={{ fontSize:28, fontStyle:"italic", color:C.ink, marginBottom:6 }}>Next time in the South</h2>
          <p className="cg" style={{ color:C.muted, fontSize:17, fontStyle:"italic", marginBottom:28 }}>The file doesn't close — it just pauses. Here's what the South still owes you.</p>

          {NEXT_TIME.map((group,gi)=>(
            <div key={gi} style={{ marginBottom:28 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                <span style={{ fontSize:18 }}>{group.emoji}</span>
                <p className="dm" style={{ color:group.color, fontSize:11, letterSpacing:".18em", textTransform:"uppercase", fontWeight:500 }}>{group.cat}</p>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {group.items.map((it,ii)=>(
                  <div key={ii} className="card" style={{ background:C.white, borderRadius:14, padding:"16px 18px", borderLeft:`4px solid ${group.color}`, boxShadow:"0 2px 16px rgba(13,79,110,.06)" }}>
                    <p className="pf" style={{ fontSize:18, fontStyle:"italic", color:C.ink, marginBottom:4 }}>{it.name}</p>
                    <p className="cg" style={{ color:"#3D3A36", fontSize:16, lineHeight:1.6 }}>{it.note}</p>
                  </div>
                ))}
              </div>
            </div>
          ))}

          <div style={{ marginTop:16, background:`linear-gradient(135deg, ${C.bari}, ${C.polignano})`, borderRadius:16, padding:"22px", textAlign:"center" }}>
            <p className="cg" style={{ color:"#FDFAF6", fontSize:18, fontStyle:"italic", lineHeight:1.5 }}>You did this one properly — pivoted with the heat, ate where the locals eat, drifted into Francavilla, earned a sea-urchin scar. Not a passenger for one second.</p>
            <p className="dm" style={{ color:C.sand, fontSize:11, letterSpacing:".2em", textTransform:"uppercase", marginTop:14 }}>Puglia · 29 Aug – 4 Sep · fin</p>
          </div>

          <p className="cg" style={{ textAlign:"center", color:C.muted, fontSize:15, fontStyle:"italic", marginTop:28, letterSpacing:".05em" }}>a presto 🤍</p>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(PugliaApp)
);
</script>
</body>
</html>
